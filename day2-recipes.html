<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Recipe of the Day - Group Challenge Day 2</title>
</head>
<body>

<!-- HTML element for the main heading (changes with the current hour) -->
<h1 id="heading"></h1>

<!-- HTML element where all three recipes will be displayed -->
<div id="recipes"></div>

<script>
    //Variables to store data
    var d = new Date(); //Current date and time from the user's computer
    var hour = d.getHours(); //Current hour in military time (0 to 23)
    var meal; //Which meal to cook: Breakfast, Lunch or Dinner
    var displayHour; //Current hour in standard time (1 to 12)
    var ampm; //AM or PM
    var output = ""; //Empty string that will collect all three recipes

    //Array: all three recipes, each one is a string containing a heading and 5 steps
    var recipes = [
        "<h2>Breakfast Recipe</h2>" +
        "1. Prepare eggs<br>" +
        "2. Heat pan<br>" +
        "3. Cook sausages<br>" +
        "4. Cook eggs to liking<br>" +
        "5. Transfer all on a plate and serve",

        "<h2>Lunch Recipe</h2>" +
        "1. Prepare burger patty<br>" +
        "2. Grill patty on medium heat<br>" +
        "3. Toast bun while grilling meat<br>" +
        "4. Prepare toppings<br>" +
        "5. Assemble ingredients into hamburger when done",

        "<h2>Dinner Recipe</h2>" +
        "1. Season salmon meat<br>" +
        "2. Cook salmon on skillet in medium heat for 5 minutes each side<br>" +
        "3. Prepare salad<br>" +
        "4. Add seasonings and dressing on salad and toss<br>" +
        "5. Transfer salmon and salad on plate"
    ];

    //Function: decision making - tests the current hour to decide which meal to cook
    function chooseMeal(hr) {
        if (hr < 12) {
            meal = "Breakfast"; //Before 12PM => Breakfast
        } else if (hr < 18) {
            meal = "Lunch"; //Before 6PM => Lunch
        } else {
            meal = "Dinner"; //6PM and after => Dinner
        }
        return meal;
    }

    //Function: converts military hour to standard time with AM or PM (example: 15 => 3 PM)
    function standardTime(hr) {
        if (hr == 0) {
            displayHour = 12;
            ampm = "AM";
        } else if (hr < 12) {
            displayHour = hr;
            ampm = "AM";
        } else if (hr == 12) {
            displayHour = 12;
            ampm = "PM";
        } else {
            displayHour = hr - 12;
            ampm = "PM";
        }
        return displayHour + " " + ampm;
    }

    //Assemble the main heading with string/variable concatenation and output it
    document.getElementById("heading").innerHTML = "You should cook " + chooseMeal(hour) + ". It's " + standardTime(hour);

    //Loop through the recipes array and add each recipe to the output string
    for (var i = 0; i < recipes.length; i++) {
        output += recipes[i];
    }

    //Output all three recipes below the main heading
    document.getElementById("recipes").innerHTML = output;
</script>

</body>
</html>
